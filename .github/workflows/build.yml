name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -scheme HealthLens \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit Tests
        run: |
          xcodebuild test \
            -scheme HealthLens \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:HealthLensTests \
            -skip-testing:HealthLensTests/CSVExportPerformanceTests \
            -parallel-testing-enabled NO \
            -resultBundlePath FastTests.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: CSV Export Performance Tests
        run: |
          xcodebuild test \
            -scheme HealthLens \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:HealthLensTests/CSVExportPerformanceTests \
            -parallel-testing-enabled NO \
            -resultBundlePath PerformanceTests.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            FastTests.xcresult
            PerformanceTests.xcresult
